name: aai-cli smoke

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Print environment
        run: |
          echo "aai-cli GitHub Actions smoke"
          echo "sha=$GITHUB_SHA"
          echo "ref=$GITHUB_REF"
      - name: Validate repository content
        run: test -f ci-smoke/github-trigger.txt
